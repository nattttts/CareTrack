<!DOCTYPE html>
<html>
<head>
    <title>Login | CareTrack</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/login.css" />
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="caretrack-header navbar navbar-expand-lg bg-white border-bottom">
        <div class="container-fluid">

            <div class="logo">

                <img src="../images/CareTrack Logo.png" alt="CareTrack Logo">

                <div class="logo-text">
                    <h1>CareTrack</h1>
                    <p>Maternal & Child Healthcare</p>
                </div>

            </div>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#careTrackNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="careTrackNavbar">
                <!-- Navigation Links -->
                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact Us</a>
                    </li>
                    
                </ul>

                <!-- Buttons -->
                <a href="#" class="loginActiveBtn">
                    <img  src="../icons/login_hover.png" alt="Login Icon">
                    Login
                </a>
            </div>

        </div>
    </header>

    <!-- ================= CONTENT ================= -->
    <div class="login-page">

        <div class="row align-items-center justify-content-center gx-1 login-row">
        
            <!-- Left Section -->
            <div class="col-12 col-lg-6">
                <section class="left-info">

                    <div class="info-content">
                        <h5>WELCOME TO CARETRACK</h5>

                        <h1>Healthcare made simpler, all in one place</h1>
                        <p>
                            Log in to access CareTrack and manage healthcare appointments, 
                            vaccination records, follow-ups, and clinic visits.
                        </p>
                    </div>

                    <img src="../images/mother_holding_baby.png" alt="Mother holding baby">
                </section>
            </div>

            <!-- Right Section -->
            <div class="col-12 col-lg-6">
                <section class="login-form-section">

                    <div class="form-container">
                        <h2>Login</h2>

                        <form>

                            <!-- IC Number -->
                            <div class="form-group">
                                <label for="icNumber">IC Number / MyKid Number</label>
                                
                                <div class="input-box">
                                    <img src="../icons/ic number.png" alt="IC Number" width="21px" height="21px">
                                    <input type="text" id="icNumber" name="icNumber" 
                                        placeholder="e.g. 920101-01-1234" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="form-group">
                                <label for="password">Password</label>

                                <div class="input-box">
                                    <img src="../icons/padlock.png" alt="Lock"  width="20px" height="20px">
                                    <input type="password" id="password" name="password" 
                                        placeholder="Enter your password" required>
                                    <img src="../icons/show.png" alt="Show Password" width="20px" height="20px">
                                </div>
                            </div>

                            <a href="reset_password.html" class="forgot-password">Forgot password?</a> 

                            <button type="submit" class="login-btn">Login</button>

                        </form>
                    </div>

                </section>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
