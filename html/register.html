<!DOCTYPE html>
<html>
<head>
    <title>Register | CareTrack</title>
    <link rel="stylesheet" href="../css/register.css" />
</head>

<body>
    <!-- Header -->
    <header>
        <div class="brand">

            <img src="../images/CareTrack Logo.png" alt="CareTrack" height="45px" width="45px">

            <div class="brand-text">
                <h3>CareTrack</h3>
                <p>Maternal & Child Healthcare</p>
            </div>

        </div>

        <div class="nav-btn">
            <a href="home.html" class="backToHomeBtn">
                <img src="../icons/back_icon.png" alt="Back Icon" width="18px" height="18px">
                Back to Home
            </a>
        </div>
    </header>

    <div class="register-page">
        <!-- Left Section -->
        <section class="left-info">

            <div class="info-content">
                <h4>WELCOME TO CARETRACK</h4>

                <h1>A healthier tomorrow <span>for you and your child</span></h1>
                <p>
                    Create your CareTrack account to track appointments, child vaccinations, 
                    follow-ups, and clinic visits in one place. 
                </p>
            </div>

            <img src="../images/mother_holding_baby.png" alt="Mother holding baby">
        </section>

        <!-- Right Section -->
        <section class="register-form-section">

            <div class="form-container">
                <h1>Create Your Account</h1>

                <form action="login.html">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name <span>*</span> </label>

                        <div class="input-box">
                            <img src="../icons/full name.png" alt="Full Name"  width="18px" height="18px">
                            <input type="text" id="fullName" name="fullName" 
                                placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="form-row">

                        <!-- IC Number -->
                        <div class="form-group">
                            <label for="icNumber">IC Number <span>*</span> </label>

                            <div class="input-box">
                                <img src="../icons/ic number.png" alt="IC Number" width="21px" height="21px">
                                <input type="text" id="icNumber" name="icNumber" 
                                    placeholder="e.g. 920101-01-1234" required>
                            </div>
                        </div>
                        
                        <!-- Date of Birth -->
                        <div class="form-group">
                            <label for="birthDate">Date of Birth <span>*</span> </label>

                            <div class="input-box">
                                <img src="../icons/calendar.png" alt="Date of Birth" width="18px" height="18px">
                                <input type="date" id="birthDate" name="birthDate"  required>
                            </div>
                        </div>

                    </div>
                    
                    <div class="form-row">

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email Address <span>*</span> </label>
                            
                            <div class="input-box">
                            <img src="../icons/email.png" alt="Email" width="20px" height="20px">
                                <input type="email" id="email" name="email" 
                                    placeholder="Enter your email address" required>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="form-group">
                            <label for="phoneNumber">Phone Number <span>*</span> </label>

                            <div class="input-box">
                                <img src="../icons/phone.png" alt="Phone" width="20px" height="20px">
                                <input type="text" id="phoneNumber" name="phoneNumber" 
                                    placeholder="e.g. 0123456789" required>
                            </div>
                        </div>
                    
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password <span>*</span> </label>

                        <div class="input-box">
                            <img src="../icons/padlock.png" alt="Lock"  width="20px" height="20px">
                            <input type="password" id="password" name="password" 
                                placeholder="Create a password" required>
                            <img src="../icons/show.png" alt="Show Password" width="20px" height="20px">
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span>*</span> </label>

                        <div class="input-box">
                            <img src="../icons/padlock.png" alt="Lock" width="20px" height="20px">
                            <input type="password" id="confirmPassword" name="confirmPassword" 
                                placeholder="Confirm your password" required>
                            <img src="../icons/show.png" alt="Show Password" width="20px" height="20px">
                        </div>
                    </div>

                    <button type="submit" class="register-btn">Create Account</button>

                </form>

                <div class="login-section">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>
            </div>

        </section>
    </div>
</body>
</html>
